name: Selftest

on:
  push:
    branches: [main]
    paths: ["techscan/**", "prompts/**", "config/**"]
  pull_request:
    branches: [main]
    paths: ["techscan/**", "prompts/**", "config/**"]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml openpyxl

      - name: Run selftest (13 planted-problem checks, no AI)
        run: python -m techscan selftest
