name: Scheduled Scan

# Manual trigger only. Enable the schedule line during event weekend.
# IMPORTANT: run this from a PRIVATE repo that references the public Action,
# so scan results (team scores, jury packs) are not publicly downloadable.
on:
  # schedule:
  #   - cron: "*/5 * * * *"  # enable during event weekend
  workflow_dispatch:
    inputs:
      submissions:
        description: "Path to submissions CSV (leave empty to pull from platform)"
        required: false
        default: ""
      force:
        description: "Force re-run even if already completed"
        required: false
        default: "false"

env:
  CONFIG: config/hfg8.yaml

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml openpyxl anthropic

      - name: Check if scan should run
        id: gate
        run: |
          python -c "
          import yaml, sys, os
          from datetime import datetime, timezone, timedelta

          with open('${{ env.CONFIG }}') as f:
              cfg = yaml.safe_load(f)
          deadline = cfg['event']['deadline']
          dt = datetime.fromisoformat(deadline)
          now = datetime.now(timezone.utc)
          grace = dt.astimezone(timezone.utc) + timedelta(minutes=30)

          if now < grace and '${{ inputs.force }}' != 'true':
              print(f'Too early: deadline {deadline} + 30min grace not reached yet')
              with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as out:
                  out.write('run=false\n')
              sys.exit(0)

          print(f'Deadline passed, scan should run')
          with open(os.environ.get('GITHUB_OUTPUT', '/dev/null'), 'a') as out:
              out.write('run=true\n')
          "

      - name: Check lockfile (prevent duplicate runs)
        if: steps.gate.outputs.run == 'true'
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "locked=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Check if a successful scan artifact already exists for this config
          EXISTING=$(gh api repos/${{ github.repository }}/actions/artifacts \
            --jq '[.artifacts[] | select(.name | startswith("techscan-results-")) | select(.expired == false)] | length' 2>/dev/null || echo "0")
          if [ "$EXISTING" -gt 0 ]; then
            echo "Scan already completed ($EXISTING artifact(s) exist). Use force=true to re-run."
            echo "locked=true" >> $GITHUB_OUTPUT
          else
            echo "locked=false" >> $GITHUB_OUTPUT
          fi

      - name: Pull from platform
        if: steps.gate.outputs.run == 'true' && steps.lock.outputs.locked != 'true' && inputs.submissions == ''
        env:
          JUNCTION_CLIENT: ${{ secrets.JUNCTION_CLIENT }}
          BUILDERBASE_API_KEY: ${{ secrets.BUILDERBASE_API_KEY }}
        run: |
          if [ -n "$JUNCTION_CLIENT" ]; then
            python -m techscan junction-pull -c ${{ env.CONFIG }}
          elif [ -n "$BUILDERBASE_API_KEY" ]; then
            echo "BuilderBase pull not yet implemented"
            exit 1
          else
            echo "No platform credentials set. Provide a submissions CSV or set JUNCTION_CLIENT / BUILDERBASE_API_KEY."
            exit 1
          fi

      - name: Run scan
        if: steps.gate.outputs.run == 'true' && steps.lock.outputs.locked != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.SCAN_GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          SUBS="${{ inputs.submissions }}"
          if [ -z "$SUBS" ]; then
            SUBS=$(find work-* -name "junction-submissions.csv" -o -name "builderbase-submissions.csv" 2>/dev/null | head -1)
          fi
          if [ -z "$SUBS" ]; then
            echo "No submissions file found"
            exit 1
          fi
          python -m techscan scan -c ${{ env.CONFIG }} -s "$SUBS" --backend anthropic

      - name: Upload scan results (private artifact)
        if: steps.gate.outputs.run == 'true' && steps.lock.outputs.locked != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: techscan-results-${{ github.run_number }}
          path: |
            out-*/scorecard.xlsx
            out-*/jury-pack-*.html
            out-*/challenge-report-*.html
          retention-days: 30

      # Email and Discord are opt-in via secrets. Discord posts to a STAFF
      # channel only (no public scores). Team reports go via email to organizers
      # who distribute them after review.

      - name: Notify staff (email)
        if: steps.gate.outputs.run == 'true' && steps.lock.outputs.locked != 'true'
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAILS: ${{ vars.NOTIFY_EMAILS }}
        run: |
          if [ -z "$SMTP_HOST" ] || [ -z "$NOTIFY_EMAILS" ]; then
            echo "Email not configured (optional: set SMTP_HOST secret and NOTIFY_EMAILS variable)"
            exit 0
          fi
          python -c "
          import smtplib, os, zipfile
          from email.mime.multipart import MIMEMultipart
          from email.mime.text import MIMEText
          from email.mime.base import MIMEBase
          from email import encoders
          from pathlib import Path
          from techscan.config import load_config

          cfg = load_config('${{ env.CONFIG }}')
          out = Path(cfg['paths']['output'])

          zip_path = out / 'techscan-results.zip'
          with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
              for f in out.glob('*.html'):
                  zf.write(f, f.name)
              for f in out.glob('*.xlsx'):
                  zf.write(f, f.name)

          msg = MIMEMultipart()
          msg['Subject'] = f'{cfg[\"event\"][\"name\"]} — Technical Scan Complete (staff only)'
          msg['From'] = os.environ['SMTP_USER']
          msg['To'] = os.environ['NOTIFY_EMAILS']
          body = f'The technical scan for {cfg[\"event\"][\"name\"]} has completed.\n\nAttached: scorecard and jury packs. Review before sharing with juries.\n\nThis is a staff notification from HFG TechScan.'
          msg.attach(MIMEText(body, 'plain'))

          with open(zip_path, 'rb') as f:
              part = MIMEBase('application', 'zip')
              part.set_payload(f.read())
              encoders.encode_base64(part)
              part.add_header('Content-Disposition', 'attachment', filename='techscan-results.zip')
              msg.attach(part)

          with smtplib.SMTP(os.environ['SMTP_HOST'], 587) as s:
              s.starttls()
              s.login(os.environ['SMTP_USER'], os.environ['SMTP_PASS'])
              s.send_message(msg)
          print(f'Staff notified: {os.environ[\"NOTIFY_EMAILS\"]}')
          "

      - name: Notify staff (Discord)
        if: steps.gate.outputs.run == 'true' && steps.lock.outputs.locked != 'true'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord not configured (optional: set DISCORD_WEBHOOK secret for staff channel)"
            exit 0
          fi
          python -c "
          import json, urllib.request, os, sys
          sys.path.insert(0, '.')
          from pathlib import Path
          from techscan.config import load_config
          from techscan.report import load_results

          cfg = load_config('${{ env.CONFIG }}')
          run, results = load_results(Path(cfg['paths']['workdir']))

          # Staff-only summary: team count + completion status, NO individual scores
          reviewed = sum(1 for r in results.values() if r.get('review'))
          total = len(results)
          lines = [
              f'**{cfg[\"event\"][\"name\"]} — Tech Scan Complete** (staff only)',
              f'{total} teams processed, {reviewed} reviewed.',
              'Download results from the GitHub Actions artifacts page.',
              'Review before sharing with juries and participants.',
          ]

          body = json.dumps({'content': chr(10).join(lines)}).encode('utf-8')
          req = urllib.request.Request(os.environ['DISCORD_WEBHOOK'], data=body,
                                       headers={'Content-Type': 'application/json'})
          urllib.request.urlopen(req, timeout=15)
          print('Staff notified via Discord')
          "
