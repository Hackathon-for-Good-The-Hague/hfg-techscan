# OneGov Hackathon Series, Editie #3 (GovTechNL), 9-10 December 2026, The Hague Tech
# Source for times, challenges and judging: EVENT.md and docs/judging-criteria.md in the four challenge repos
# (checked 26 Nov). Lines marked FILL IN still need input.
#
# Event day, 10 December. The deadline (14:00) is also when the first-round pitches and the technical jury
# start, so there is no gap: warm the review cache beforehand. Reviews are cached per team input, so a
# later run only re-reviews teams that pushed since the previous one.
#   12:00  python -m techscan scan -c config/onegov3.yaml        (all teams, full review)
#   13:30  python -m techscan scan -c config/onegov3.yaml        (only changed teams)
#   14:00  python -m techscan scan -c config/onegov3.yaml        (final: code frozen at 14:00, changed teams only)
# Before the event (set ALKEMIO_SESSION first, see sources: below):
#   python -m techscan preflight -c config/onegov3.yaml --ping
#   python -m techscan pull -c config/onegov3.yaml               (check the merged CSV)

event:
  name: "OneGov Hackathon Series - Editie #3"
  short_name: "OneGov #3"
  context: >-
    OneGov is the GovTechNL hackathon series where civil servants, developers and partners build open,
    reusable solutions for Dutch government. Theme of this edition: digital autonomy and sovereignty
    (digitale autonomie en soevereiniteit). The submission is the team's Alkemio entry, linking a public
    GitHub repository (a fork of the starter repository or the team's own) with an open-source licence and a
    README that says how to run the work; a pull request into the starter repository is optional. Each
    challenge has Must criteria that are pass or fail. The technical jury checks: is the repository public
    with an open-source licence, is the code readable with a clear README, can someone else reproduce it,
    are assumptions documented, and is it clear what is simulated.
  build_time: "about a day and a half of building (9 December 09:40 to 20:00, and 10 December 08:30 to the 14:00 deadline)"
  # Kick-off on the main stage; hacking starts 09:40. Commits dated more than 2 hours before this get flagged
  # (teams formed at the pre-hackathon on 26 Nov, so early repos are possible: the flag says to ask).
  start: "2026-12-09T09:00:00+01:00"
  # Submission deadline in Alkemio. The scan reviews the last commit before this moment.
  deadline: "2026-12-10T14:00:00+01:00"
  github_org: "govtechnl"

# GovTechNL house style (onegov-design-kit/engine/brand.py). The kit is private, so its logos and fonts
# are not copied into this repo: clone it next to the other govtechnl repos
#   gh repo clone govtechnl/onegov-design-kit  (into C:/Users/<you>/repos/govtechnl/)
# Missing files are left out of the pack; preflight warns about them.
# Pink text on the blue cover fails contrast (1.7:1), so the cover follows the scorecard: light pink, blue text.
branding:
  primary: "#2C55A1"           # Figma "Blue"
  accent: "#E52983"            # Figma "Dark Pink"
  background: "#F9DAEA"        # Figma "Light Pink"
  tint: "#FDEEF5"
  highlight: "#FDEEF5"
  cover_background: "#F9DAEA"
  cover_text: "#2C55A1"
  cover_accent: "#E52983"
  font_family: "Figtree,'Segoe UI',Arial,sans-serif"   # Figtree stands in for Sofia Pro, as in the design kit
  font_files:
    400: ../../../govtechnl/onegov-design-kit/assets/fonts/Body-400.ttf
    700: ../../../govtechnl/onegov-design-kit/assets/fonts/Body-700.ttf
  logos:
    - ../../../govtechnl/onegov-design-kit/assets/logos/onegov/series-lockup-small.png   # blue text; the "-blue" wordmark is white text for blue backgrounds
    - ../../../govtechnl/onegov-design-kit/assets/logos/govtechnl/logo.png
  footer: "OneGov Hackathon Series · GovTechNL · technische review door TechScan (Hackathon OS)"
  no_em_dashes: true

# The Alkemio form ("Inzending" in each challenge subspace) is the submission; a PR into a starter repo is
# optional. Alkemio comes first so its team names win when a team is found in both. A repo link or a pull
# request link in the form is resolved to the team's repo and branch.
#
# Alkemio has no API keys: TechScan logs in with the browser session of a space admin (only admins can
# read every form response). On the morning of each event day:
#   1. log in at https://alkem.io, F12 -> Application -> Cookies -> https://alkem.io -> alkemio_session
#   2. PowerShell:  $env:ALKEMIO_SESSION = "<value>"   (bash: export ALKEMIO_SESSION=...)
#      Never put the value in a file in this repo: it gives full access to the Alkemio account.
#   3. python -m techscan preflight -c config/onegov3.yaml --ping   (logs in, checks admin access per form)
# Teams can only send the form once (withdraw and resend to change it), and each member can send one, so
# the scan keeps the newest response per team name. The 12:00 scan only sees teams that already sent the
# form: ask teams in the morning briefing to send it by 12:00 with at least team name and repository link.
sources:
  - type: alkemio
    space: onegov-hackathon
    callout: inzending
    label: Alkemio
  - type: github-prs
    exclude_authors: ["dependabot[bot]"]

# Four challenges (EVENT.md). match: words that identify the challenge in the platform's challenge field.
# brief_files: judging criteria first, because the brief is capped at review.brief_chars.
# requirements: deterministic checks taken from each docs/judging-criteria.md (evidence, never a verdict).
# Must-box and CI checks only apply to teams that opened a PR; submission_dir only to forks of the starter.
challenges:
  inferentie-netwerk:
    name: "Overheid Inferentie Netwerk"
    match: ["inferentie", "inference"]
    template: "https://github.com/govtechnl/onegov3-inferentie-netwerk.git"
    brief_files: ["docs/judging-criteria.md", "CHALLENGE.md"]
    data_hints: ["network.yaml", "policy.yaml", "scenarios.yaml", "werkdag.csv", "market-mock", "routing",
                 "settlement", "gateway", "litellm"]
    requirements:
      team_work: [code, notebook, config, doc]   # routing rules in config and a governance design count
      open_licence: true      # M5
      submission_dir: "submissions/"
      must_checklist: true    # M1-M5 boxes in the PR template
      pr_checks: true
      # no explicit_rules: AI gateways and model calls are the subject of this challenge
  inkooptafel:
    name: "Van beleid naar inkooptafel"
    match: ["inkooptafel", "inkoop", "procurement", "seal"]
    template: "https://github.com/govtechnl/onegov3-inkooptafel.git"
    brief_files: ["docs/judging-criteria.md", "CHALLENGE.md"]
    data_hints: ["toets.yaml", "sources.yaml", "requirements", "selectie", "seal", "scope", "tenderned", "advies"]
    requirements:
      team_work: [code, notebook, config, doc]   # selection rules in YAML and docs are team work
      open_licence: true      # M5
      tests: true             # rules-as-code should be testable (X5)
      explicit_rules: >-
        M4 and X1: a language model must not decide the SEAL level, the classification or the selection of
        requirements. Using a model to find candidate requirements in sources is fine. Ask what the model decides.
      submission_dir: "submissions/"
      must_checklist: true    # note: the PR template's M1-M3 still describe the older classification task
      pr_checks: true
  synthpop-py:
    name: "synthpop.py"
    match: ["synthpop", "synthetic", "synthetisch", "duo"]
    template: "https://github.com/govtechnl/onegov3-synthpop-py.git"
    brief_files: ["docs/judging-criteria.md", "CHALLENGE.md", "docs/business-rules.md"]
    data_hints: ["synthpop", "rulecheck", "evaluate.py", "synthetic_homicide", "spmse", "s_pmse",
                 "special_syn_method", "column_order", "2834727"]
    requirements:
      team_work: [code, notebook, config, doc]
      open_licence: true      # M4 (code licence; this repo also ships LICENSE-DATA)
      tests: true             # C4: a contribution with tests
      pr_checks: true         # ci.yml; no Must boxes in this PR template and no submissions/ folder
  open-algoritme:
    name: "Open Algoritme"
    match: ["open algoritme", "algoritme", "gezag", "motivering"]
    template: "https://github.com/govtechnl/onegov3-open-algoritme.git"
    brief_files: ["docs/judging-criteria.md", "CHALLENGE.md"]
    data_hints: ["rvig-gezag", "scenarios.json", "gezag", "algoritmeregister", "reisdocument-minderjarige",
                 "motivering", "openalgoritme", "uitleg"]
    requirements:
      team_work: [code, notebook, config, doc]   # templates and explanation texts are the deliverable
      open_licence: true      # M4: OSI for code, CC BY 4.0 / CC0 for texts and templates
      tests: true
      submission_dir: "submissions/"
      must_checklist: true    # M1-M4 boxes in the PR template
      pr_checks: true
      # no explicit_rules: a model may draft the motivering (C2 even invites a chatbot); the AI review judges
      # traceability (S1, S4) against the brief

# Partner tools to detect in code (regular expressions, case-insensitive). GreenPT has a bonus prize.
partners:
  greenpt:
    label: "GreenPT"
    patterns: ['green[\s_-]?pt', 'api\.greenpt\.']

review:
  # claude-cli uses your Claude Code login. GreenPT (EU-hosted open models, the edition's tech partner) is the
  # alternative: set GREENPT_API_KEY, switch the lines below, then list its models with
  #   python -m techscan preflight -c config/onegov3.yaml --ping
  # (scan also takes --backend greenpt --model <id> to try it without editing this file)
  # Both backends keep separate review caches, so you can run one, then the other, and compare.
  # Open models have smaller context windows: if reviews fail as "too long", lower budget_chars (the scan
  # already retries once with half).
  backend: claude-cli
  model: claude-sonnet-4-6
  # backend: greenpt
  # model: glm-5.3         # tested 26 Nov on a OneGov #2 team against Claude: comparable review, 0 invalid
  #                        # citations, ~2 min. kimi-k3.1-pro also good but ~3.5 min (needs max_output_tokens 32000);
  #                        # mistral-medium-3.5-128b miscounted and asked generic questions.
  # Parallel reviews. About 2.5 minutes per team: 4 workers do 20 changed teams in about 13 minutes.
  workers: 4
  # AI-written text (summaries, claims, jury questions) in Dutch; fixed labels stay English
  language: nl
  budget_chars: 400000
  max_file_chars: 40000
  brief_chars: 26000       # the largest brief (judging criteria + CHALLENGE.md) is about 23,000 characters
  timeout_minutes: 15
  claude_path: ""
  effort: ""
  deep_teams: []

# Scorekaart Ronde 1 (challenge owners and technical jury, 10 Dec 14:00): six criteria, 1-5, total /30.
# The Finale card swaps Technische kwaliteit for Presentatie, which the code cannot show; use Ronde 1 here.
# Scores stay hidden in the jury pack; the jury scores on paper.
rubric:
  show_scores_to_jury: false
  max_score: 5
  max_total: 30
  criteria:
    impact:
      label: "Impact"
      weight: 1
      description: "Lost het de vraag structureel op? (Does it solve the question structurally, not just for one case?)"
    uitvoerbaarheid:
      label: "Uitvoerbaarheid"
      weight: 1
      description: "Realistisch te implementeren binnen een overheidsorganisatie? (Realistic to implement inside a government organisation: dependencies, security, maintainability, fit with existing systems.)"
    autonomie:
      label: "Digitale autonomie"
      weight: 1
      description: "Meer regie over eigen data, systemen of infrastructuur? (Does it give government more control over its own data, systems or infrastructure, or does it add lock-in to a single vendor or non-EU service?)"
    open_source:
      label: "Open source potentie"
      weight: 1
      description: "Kunnen anderen het hergebruiken en doorontwikkelen? (Can others reuse and build on it: open licence, documentation, reproducible setup, rules separate from code.)"
    aansluiting:
      label: "Aansluiting challenge"
      weight: 1
      description: "Beantwoordt het de gestelde vraag? Score against the Must/Should criteria in the brief; failing a Must caps this score."
    technisch:
      label: "Technische kwaliteit"
      weight: 1
      description: "Werkt het, is de repository bruikbaar? The technical jury's checks: public repository with an open-source licence, readable code with a clear README, reproducible by someone else, assumptions documented, and clear what is simulated."

scan:
  pre_event_grace_hours: 2
  big_drop_lines: 1500
  big_drop_share: 0.4
  similarity_min_shared_lines: 25
  similarity_min_ratio: 0.2
  check_demo_urls: true
  github_api: true

paths:
  workdir: ../work-onegov3
  output: ../out-onegov3
